name: CI — Tests & Lint

on:
  push:
    branches: [Develop, main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo workflow en la misma rama/PR
# para evitar checks duplicados al hacer push a una rama con PR abierto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (sin paquete privado)
        run: |
          pip install --upgrade pip
          # Instala todo excepto django-components-ui (paquete privado sin acceso en CI).
          # En testing se usa app.components_ui_stub como reemplazo local.
          grep -v "django-components-ui" requirements.txt | pip install -r /dev/stdin

      - name: Run tests
        env:
          DJANGO_ENV: testing
          DJANGO_SETTINGS_MODULE: app.config.settings
          DEBUG: "True"
          SECRET_KEY: "ci-secret-key-not-used-in-prod"
          RECAPTCHA_PUBLIC_KEY: "ci-fake-public-key"
          RECAPTCHA_PRIVATE_KEY: "ci-fake-private-key"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python app/manage.py test --verbosity=2

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ --select F401,F811,E711,E712 --output-format=github
