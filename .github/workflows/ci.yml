name: CI — Tests & Lint

on:
  push:
    branches: [Develop, main]
  pull_request:
    branches: [main]

env:
  # Fuerza Node.js 24 en las actions para evitar el warning de deprecación de Node 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        env:
          GITHUB_TOKEN_COMPONENTES: ${{ secrets.GITHUB_TOKEN_COMPONENTES }}
        run: |
          pip install --upgrade pip

          # Configurar credenciales git para el paquete privado.
          # .netrc es el método más fiable: git usa x-access-token:PAT como credencial.
          printf "machine github.com login x-access-token password %s\n" "${GITHUB_TOKEN_COMPONENTES}" > ~/.netrc
          chmod 600 ~/.netrc

          # Reescribir la URL con token embebido → URL limpia (las credenciales vienen de .netrc).
          # Esto permite que requirements.txt use ${GITHUB_TOKEN_COMPONENTES} en la URL sin que
          # git lo trate como username y pida password por separado.
          git config --global url."https://github.com/".insteadOf "https://${GITHUB_TOKEN_COMPONENTES}@github.com/"

          # envsubst expande ${GITHUB_TOKEN_COMPONENTES}; git reescribe la URL a https://github.com/
          envsubst < requirements.txt | pip install -r /dev/stdin

      - name: Run tests
        env:
          DJANGO_ENV: testing
          DJANGO_SETTINGS_MODULE: app.config.settings
          DEBUG: "True"
          SECRET_KEY: "ci-secret-key-not-used-in-prod"
          # Claves ficticias: SILENCED_SYSTEM_CHECKS ya desactiva la validación de recaptcha
          RECAPTCHA_PUBLIC_KEY: "ci-fake-public-key"
          RECAPTCHA_PRIVATE_KEY: "ci-fake-private-key"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python app/manage.py test --verbosity=2

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ --select F401,F811,E711,E712 --output-format=github
