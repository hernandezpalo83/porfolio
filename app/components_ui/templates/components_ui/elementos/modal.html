<div id="modal-{{ id }}" 
     class="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm transition-opacity duration-300 {% if not open_on_load %}hidden opacity-0{% endif %}"
     onclick="{% if close_on_click_outside %}this.classList.add('hidden', 'opacity-0'){% endif %}">
    
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden {{ width|default:'md:w-1/2' }} max-h-[90vh] flex flex-col transform transition-transform duration-300 scale-95 origin-center"
         onclick="event.stopPropagation()">
        
        <!-- Header -->
        <div class="px-8 py-6 border-b border-gray-100 flex items-center justify-between bg-primary-50/10">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-primary-100 text-primary-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                </div>
                <h3 class="text-xl font-black text-gray-900 tracking-tight">{{ title|default:"Diálogo de Sistema" }}</h3>
            </div>
            
            <button onclick="document.getElementById('modal-{{ id }}').classList.add('hidden', 'opacity-0')" 
                    class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>
        
        <!-- Body (Slots would be better but here we simulate content or pass it in context) -->
        <div class="px-8 py-10 overflow-y-auto bg-white flex-1 text-gray-600 leading-relaxed">
            {% if content %}{{ content|safe }}{% else %}
            <!-- Fallback content if no content is provided -->
            <div class="text-center py-12 border-2 border-dashed border-gray-50 rounded-3xl">
                <p class="text-sm font-medium text-gray-300 uppercase tracking-widest italic">Contenedor de diálogo preparado para inyección de contenido.</p>
            </div>
            {% endif %}
        </div>
        
        <!-- Footer -->
        <div class="px-8 py-6 bg-gray-50/50 border-t border-gray-100 flex justify-end gap-3">
            <button onclick="document.getElementById('modal-{{ id }}').classList.add('hidden', 'opacity-0')" 
                    class="px-6 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-gray-50 transition-all">Cancelar</button>
            <button class="px-6 py-2.5 bg-primary-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-primary-700 shadow-lg shadow-primary-500/20 transition-all">Confirmar Acción</button>
        </div>
    </div>
</div>

<script>
window.showModal = function(id) {
    const modal = document.getElementById('modal-' + id);
    if (modal) {
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modal.children[0].classList.remove('scale-95');
        }, 10);
    }
}
window.hideModal = function(id) {
    const modal = document.getElementById('modal-' + id);
    if (modal) {
        modal.classList.add('opacity-0');
        modal.children[0].classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
    }
}
</script>
