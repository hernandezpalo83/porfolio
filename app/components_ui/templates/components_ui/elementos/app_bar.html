<header class="{% if fixed %}fixed top-0 left-0 right-0 z-40{% endif %} w-full 
               bg-{{ color }}-600 text-white 
               {% if shadow %}shadow-md{% endif %} 
               {{ classes }}">
    <div class="px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <div class="flex items-center">
                {% if left_icon %}
                <button type="button" class="mr-4 p-2 rounded-md hover:bg-{{ color }}-700 focus:outline-none">
                    {% include "components_ui/elementos/icon.html" with name=left_icon %}
                </button>
                {% endif %}
                <h1 class="text-xl font-bold tracking-tight">{{ title }}</h1>
            </div>
            <div class="flex items-center gap-4">
                <!-- Acciones derecha (slot) -->
            </div>
        </div>
    </div>
</header>
{% if fixed %}<div class="h-16 w-full"></div><!-- Spacer for fixed topbar -->{% endif %}
