<div class="bg-white rounded-xl {{ shadow }} border border-gray-100 overflow-hidden transition-all duration-200 hover:shadow-lg {{ classes }}">
    {% if title or subtitle %}
    <div class="px-6 py-5 border-b border-gray-100 bg-gray-50/50">
        {% if title %}<h3 class="text-lg leading-6 font-semibold text-gray-900">{{ title }}</h3>{% endif %}
        {% if subtitle %}<p class="mt-1 max-w-2xl text-sm text-gray-500">{{ subtitle }}</p>{% endif %}
    </div>
    {% endif %}
    
    <div class="{{ padding }}">
        {% if value %}
            <div class="text-3xl font-bold text-gray-900 mb-2">{{ value }}</div>
        {% endif %}
        <!-- Aquí iría el inner content si permitiera slots el template tag, por ahora es presentacional paramétrico -->
    </div>
</div>
