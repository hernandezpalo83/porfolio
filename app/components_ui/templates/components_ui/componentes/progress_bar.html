<div class="w-full relative {{ classes }}">
    {% if show_label %}
    <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-gray-500 uppercase tracking-tighter">Progreso</span>
        <span class="text-xs font-black text-{{ color|default:'primary' }}-600">{{ value }} / {{ max_val|default:100 }}</span>
    </div>
    {% endif %}
    <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden shadow-inner">
        <div class="h-full bg-{{ color|default:'primary' }}-500 rounded-full transition-all duration-500 relative" style="width: {% widthratio value|default:0 max_val|default:100 100 %}%">
            <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
        </div>
    </div>
</div>
