{% load components_ui %}
<nav class="bg-primary-600 border-b border-primary-700 {{ classes }}">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      
      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
        <div class="flex flex-shrink-0 items-center text-white font-bold text-xl">
          {{ title }}
        </div>
        <div class="hidden sm:ml-6 sm:block">
          <div class="flex space-x-4">
            {% for link in links %}
            <a href="{{ link.url }}" class="{% if link.active %}bg-primary-700{% else %}hover:bg-primary-500 hover:text-white{% endif %} text-white rounded-md px-3 py-2 text-sm font-medium" {% if link.active %}aria-current="page"{% endif %}>{{ link.name }}</a>
            {% empty %}
            <a href="/" class="bg-primary-700 text-white rounded-md px-3 py-2 text-sm font-medium">Inicio</a>
            {% endfor %}
          </div>
        </div>
      </div>
      
      {% if show_user %}
      <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
        <!-- Profile dropdown -->
        <div class="relative ml-3">
          <div>
            <button type="button" data-dropdown-toggle="user-menu-dropdown" class="relative flex rounded-full bg-primary-800 text-sm focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary-800">
              <span class="sr-only">Open user menu</span>
              {% include "components_ui/elementos/icon.html" with name='UserIcon' size="w-8 h-8 rounded-full text-white p-1" %}
            </button>
          </div>
          <div id="user-menu-dropdown" class="hidden absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu">
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Tu Perfil</a>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Configuración</a>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Cerrar Sesión</a>
          </div>
        </div>
      </div>
      {% endif %}
      
    </div>
  </div>
</nav>
