{% load components_ui %}
<!-- Tabulator Theme: {{ theme }} -->
{% if theme and theme != 'default' %}
<link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_{{ theme }}.min.css" rel="stylesheet">
{% else %}
<link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator.min.css" rel="stylesheet">
{% endif %}

<div class="comp-tabla-container space-y-4 {{ classes }}" style="height: {{ height }};">
    {% if searchable %}
    <div class="mb-4 flex items-center bg-white p-2 border border-gray-200 rounded-lg shadow-sm">
        <label for="search-{{ id|default:'main' }}" class="sr-only">Buscar</label>
        <div class="relative w-full">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                {% comp_icon name="MagnifyingGlassIcon" size="w-4 h-4" %}
            </div>
            <input type="text" id="search-{{ id|default:'main' }}" 
                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-2.5" 
                   placeholder="Buscar en la tabla..."
                   onkeyup="window.dispatchEvent(new CustomEvent('tabulator-search', {detail: {id: '{{ id|default:'main' }}', value: this.value}}))">
        </div>
    </div>
    {% endif %}

    <div id="tabulator-{{ id|default:'main' }}" 
         class="shadow ring-1 ring-black ring-opacity-5 md:rounded-lg overflow-hidden" 
         style="height: {{ height }};"
         data-comp-type="tabulator"
         data-url="{{ data_url }}"
         data-page-size="{{ page_size }}"
         data-selectable="{{ selectable|lower }}"
         data-editable="{{ editable|lower }}"
         data-group-by="{{ group_by|default:'' }}"
         data-filterable="{{ filterable|lower }}"
         data-columns='{{ columns|to_json }}'
         data-theme="{{ theme|default:'default' }}">
        <div class="flex items-center justify-center h-full bg-gray-50 text-gray-500 animate-pulse">
            <span class="text-sm font-medium">Cargando Tabulador...</span>
        </div>
    </div>
</div>
