<div class="modal fade" id="promptModal" tabindex="-1" aria-labelledby="modalTitleLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            
            <div class="modal-header border-0 pb-0 pt-4 px-4">
                <h5 class="modal-title fw-bold" id="modalTitleLabel">
                    <i class="bi bi-magic me-2 text-primary"></i> 
                    <span>Nuevo Prompt</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form id="promptForm" method="post">
                {% csrf_token %}
                <div class="modal-body p-4">
                    <input type="hidden" id="edit_id" name="id">
                    
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="modal_title" class="form-label small fw-bold text-muted text-uppercase">Título del Prompt</label>
                            <input type="text" class="form-control bg-light border-0 py-2" id="modal_title" name="title" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label for="modal_category" class="form-label small fw-bold text-muted text-uppercase">Categoría</label>
                            <input type="text" class="form-control bg-light border-0 py-2" id="modal_category" name="category" list="categoryList" required>
                            <datalist id="categoryList">
                                {% for cat in categories %}
                                    <option value="{{ cat }}">
                                {% endfor %}
                            </datalist>
                        </div>

                        <div class="col-12">
                            <label for="modal_description" class="form-label small fw-bold text-muted text-uppercase">Descripción</label>
                            <input type="text" class="form-control bg-light border-0 py-2" id="modal_description" name="description">
                        </div>

                        <div class="col-12">
                            <label for="modal_content" class="form-label small fw-bold text-muted text-uppercase">Cuerpo del Prompt</label>
                            <textarea class="form-control bg-light border-0" id="modal_content" name="prompt" rows="12" 
                                      style="font-family: 'Fira Code', monospace; font-size: 0.85rem;" required></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">Descartar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
