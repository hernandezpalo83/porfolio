<div class="bg-white border-end shadow-sm" id="sidebar">
    <div class="sidebar-heading border-bottom bg-white d-flex align-items-center px-4" style="height: 60px;">
        <span class="fw-bold fs-5 text-primary">Hernandez<span class="text-dark">Palo</span></span>
    </div>
    
    <div class="list-group list-group-flush mt-3 px-2">
        {% for item in menu_items_int %}
            {% if not item.submenus.all %}
                {# ITEM SIMPLE (SIN SUBMENÚ) #}
                <a href="{% if item.url_name %}{% url item.app_name|add:':'|add:item.url_name %}{% else %}#{% endif %}" 
                   class="list-group-item list-group-item-action border-0 rounded-3 mb-1 py-2 d-flex align-items-center"
                   data-bs-toggle="tooltip" data-bs-placement="right" title="{{ item.title }}">
                    <i class="{{ item.icon }} me-3 fs-5"></i>
                    <span class="menu-text">{{ item.title }}</span>
                </a>
            {% else %}
                {# ITEM CON SUBMENÚ #}
                <div class="mb-1">
                    <button class="list-group-item list-group-item-action border-0 rounded-3 py-2 d-flex align-items-center w-100" 
                            data-bs-toggle="collapse" data-bs-target="#sub-{{ item.id }}" aria-expanded="false">
                        <i class="{{ item.icon }} me-3 fs-5"></i>
                        <span class="menu-text flex-grow-1 text-start">{{ item.title }}</span>
                        <i class="bi bi-chevron-down ms-auto menu-text small opacity-50"></i>
                    </button>
                    
                    <div class="collapse ms-2 mt-1" id="sub-{{ item.id }}">
                        {% for sub in item.submenus.all %}
                            <a href="{% if sub.url_name %}{% url sub.app_name|add:':'|add:sub.url_name %}{% else %}#{% endif %}" 
                               class="list-group-item list-group-item-action border-0 rounded-3 py-2 small d-flex align-items-center ps-4">
                                <i class="{{ sub.icon }} me-2"></i>
                                <span class="menu-text">{{ sub.title }}</span>
                            </a>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
