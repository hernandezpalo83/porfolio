<div class="bg-white border-end" id="sidebar">
    <div class="sidebar-heading border-bottom">
        <span class="text-primary fw-bold fs-5">Hernandez<span class="text-dark">Palo</span></span>
    </div>
    
    <div class="list-group list-group-flush mt-3">
        {% for item in menu_items_int %}
            {% if not item.submenus.all %}
                <a href="{% if item.url_name %}{% url item.app_name|add:':'|add:item.url_name %}{% else %}#{% endif %}" 
                   class="list-group-item list-group-item-action border-0 mb-1"
                   data-bs-toggle="tooltip" data-bs-placement="right" title="{{ item.title }}">
                    <i class="{{ item.icon }}"></i>
                    <span class="menu-text">{{ item.title }}</span>
                </a>
            {% else %}
                <div class="mb-1 px-1">
                    <button class="list-group-item list-group-item-action border-0 w-100 justify-content-start" 
                            data-bs-toggle="collapse" 
                            data-bs-target="#sub-{{ item.id }}">
                        <i class="{{ item.icon }}"></i>
                        <span class="menu-text flex-grow-1 text-start">{{ item.title }}</span>
                        <i class="bi bi-chevron-down ms-auto menu-text small opacity-50"></i>
                    </button>
                    
                    <div class="collapse ms-3 mt-1" id="sub-{{ item.id }}">
                        {% for sub in item.submenus.all %}
                            <a href="{% if sub.url_name %}{% url sub.app_name|add:':'|add:sub.url_name %}{% else %}#{% endif %}" 
                               class="list-group-item list-group-item-action border-0 py-2 small rounded-pill">
                                <i class="{{ sub.icon }} fs-6"></i>
                                <span class="menu-text">{{ sub.title }}</span>
                            </a>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
