<input
    type="hidden"
    name="{{ widget.name }}"
    {% for name, value in widget.attrs.items %}{% if value is not False %} {{ name }}{% if value is not True %}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}
>
<script>
(function () {
    var field = document.querySelector('.g-recaptcha[data-widget-uuid="{{ widget_uuid }}"]');
    if (!field || !field.form) return;
    var form = field.form;
    var loading = null;
    var src = 'https://{{ recaptcha_domain }}/recaptcha/api.js?render={{ public_key }}{% if api_params %}&{{ api_params }}{% endif %}';

    function load() {
        if (loading) return loading;
        loading = new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.onload = function () { window.grecaptcha.ready(resolve); };
            s.onerror = reject;
            document.head.appendChild(s);
        });
        return loading;
    }

    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) { load(); io.disconnect(); }
        }, { rootMargin: '600px 0px' });
        io.observe(form);
    }
    form.addEventListener('focusin', load, { once: true });

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        var button = form.querySelector('[type="submit"]');
        if (button) button.disabled = true;
        load().then(function () {
            return window.grecaptcha.execute('{{ public_key }}', {% if action %}{ action: '{{ action|escapejs }}' }{% else %}{}{% endif %});
        }).then(function (token) {
            field.value = token;
            form.submit();
        }).catch(function () {
            if (button) button.disabled = false;
        });
    });
})();
</script>
