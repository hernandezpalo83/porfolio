{% load static %}
<section id="intro">
    <div class="intro-overlay"></div>
    <div class="intro-content">
        <div class="row">
            <div class="col-twelve">
                <h5 data-aos="fade-down" data-aos-delay="100">Hello, World.</h5>
                <h1 data-aos="fade-up" data-aos-delay="300">I'm {{ info.name }} <br>
                    <small style="font-size: 0.5em; vertical-align: middle; opacity: 0.9;">
                        <span id="typed-roles"></span>
                    </small>
                </h1>
                <h2 class="intro-position" style="min-height: 2em;" data-aos="fade-up" data-aos-delay="500">
                    <span>{{info.resumen}}</span>
                </h2>

                <div class="intro-buttons" data-aos="fade-up" data-aos-delay="700"
                    style="margin-top: 3rem; display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap;">
                    <a class="button stroke smoothscroll" href="#about" title="Saber más">Más sobre mí</a>

                    <a href="{% static 'cv/CV_Javier_Hernandez.pdf' %}" class="button button-primary"
                        style="background-color: #CC0052; border-color: #CC0052; color: #fff; display: inline-flex; align-items: center; gap: 10px;"
                        download="CV_Javier_Hernandez_Martin.pdf">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Descargar CV
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
