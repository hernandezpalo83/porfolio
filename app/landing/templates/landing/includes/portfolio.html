<section id="portfolio">
    <div class="row section-intro">
        <div class="col-twelve">
            <h5 data-aos="fade-up">Portfolio</h5>
            <h1 data-aos="fade-up" data-aos-delay="200">Casos de Éxito y Proyectos</h1>
        </div>
    </div>
    <div class="portfolio-grid">
        {% for project in projects %}
        <div class="project-card" data-aos="fade-up" data-aos-delay="100">
            <div class="project-image-wrapper">
                {% if project.categoria %}
                <span class="project-badge">{{ project.categoria }}</span>
                {% endif %}
                {% if project.imagen %}
                <img src="{{ project.imagen }}" alt="{{ project.title }}" loading="lazy">
                {% endif %}
            </div>
            <div class="project-card-info">
                <h3 class="project-title">{{ project.title }}</h3>
                <div class="project-description">{{ project.description|safe }}</div>
                {% if project.link %}
                <a href="{{ project.link }}" target="_blank" class="btn-view-more">Ver Proyecto</a>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>
