<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | HernandezPalo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'landing/css/login.css' %}">
</head>

<body>

    <div class="login-card">
        <div class="header-section">
            <a href="{% url 'landing:index' %}" class="logo">Hernandez<span>Palo</span></a>
            <div class="subtitle">Acceso al portal privado</div>
        </div>

        <form method="post" id="loginForm">
            {% csrf_token %}

            {% if form.errors %}
            <div class="error-message">
                <i class="bi bi-exclamation-circle"></i>
                Usuario o contraseña incorrectos.
            </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" required placeholder="ej. javier83" autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" required placeholder="Tu contraseña">
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                Siguiente
            </button>
        </form>

        <div class="footer-links">
            <a href="{% url 'landing:index' %}">
                <i class="bi bi-arrow-left"></i> Volver al portfolio
            </a>
        </div>
    </div>

    <script src="{% static 'landing/js/login.js' %}" defer></script>
</body>

</html>
