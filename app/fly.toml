# fly.toml app configuration file generated for porfolio-polished-water-5224 on 2025-12-21T19:59:57+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'porfolio-polished-water-5224'
primary_region = 'ams'
console_command = '/code/manage.py shell'

[build]

[deploy]
  release_command = "python /code/manage.py migrate && python /code/manage.py collectstatic --noinput"

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "porfolio_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
