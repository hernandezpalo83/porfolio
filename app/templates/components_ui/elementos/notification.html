<div id="notify-{{ id }}" class="fixed {{ position|default:'bottom-4 right-4' }} z-[9999] transform translate-y-32 opacity-0 transition-all duration-500 ease-out {{ classes }}" 
     data-duration="{{ duration|default:3000 }}">
    
    <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 p-4 flex items-center gap-4 min-w-[300px] overflow-hidden group">
        <!-- Decoration -->
        <div class="absolute top-0 left-0 w-1 h-full bg-{{ type|default:'info'|replace:'info,primary' }}-500"></div>
        
        <div class="flex-shrink-0 p-3 bg-{{ type|default:'info'|replace:'info,primary' }}-50 text-{{ type|default:'info'|replace:'info,primary' }}-600 rounded-xl">
             {% if type == 'success' %}
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
             {% elif type == 'error' %}
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
             {% else %}
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
             {% endif %}
        </div>
        
        <div class="flex-1">
            <h4 class="text-xs font-black uppercase tracking-widest text-gray-400 mb-0.5">{{ type|default:"Notificación"|title }}</h4>
            <p class="text-sm font-bold text-gray-900">{{ message }}</p>
        </div>
        
        <button onclick="document.getElementById('notify-{{ id }}').classList.add('translate-y-32', 'opacity-0')" 
                class="flex-shrink-0 text-gray-300 hover:text-gray-500 transition-colors p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
    </div>
</div>

<script>
(function() {
    const notify = document.getElementById('notify-{{ id }}');
    if (notify) {
        setTimeout(() => {
            notify.classList.remove('translate-y-32', 'opacity-0');
            notify.classList.add('translate-y-0', 'opacity-100');
        }, 100);
        
        const duration = parseInt(notify.getAttribute('data-duration'));
        if (duration > 0) {
            setTimeout(() => {
                notify.classList.add('translate-y-32', 'opacity-0');
                notify.classList.remove('translate-y-0', 'opacity-100');
            }, duration);
        }
    }
})();
</script>
