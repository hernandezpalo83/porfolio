<div class="mb-4 {{ classes }}">
    {% if level == 1 %}
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight {{ color }}">{{ text }}</h1>
    {% elif level == 2 %}
    <h2 class="text-xl sm:text-2xl font-semibold tracking-tight {{ color }}">{{ text }}</h2>
    {% elif level == 3 %}
    <h3 class="text-lg sm:text-xl font-medium tracking-tight {{ color }}">{{ text }}</h3>
    {% elif level == 4 %}
    <h4 class="text-base sm:text-lg font-medium {{ color }}">{{ text }}</h4>
    {% elif level == 5 %}
    <h5 class="text-sm font-semibold {{ color }} uppercase tracking-wider">{{ text }}</h5>
    {% else %}
    <h6 class="text-sm font-medium {{ color }}">{{ text }}</h6>
    {% endif %}
    {% if hr %}<hr class="mt-2 border-gray-200">{% endif %}
</div>
