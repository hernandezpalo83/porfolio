<div class="{{ classes }}">
    {% if label %}
    <label for="{{ name }}" class="comp-label">
        {{ label }}{% if required %} <span class="text-error-600">*</span>{% endif %}
    </label>
    {% endif %}
    <div class="relative rounded-md shadow-sm">
        <input 
            type="number" 
            name="{{ name }}" 
            id="{{ name }}" 
            class="comp-input block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm 
                   {% if disabled %}bg-gray-100 text-gray-500{% endif %}"
            value="{{ value }}"
            {% if min_val is not None %}min="{{ min_val }}"{% endif %}
            {% if max_val is not None %}max="{{ max_val }}"{% endif %}
            step="{{ step }}"
            {% if required %}required{% endif %}
            {% if disabled %}disabled{% endif %}
        >
    </div>
</div>
