<div class="{{ classes }}">
    {% if label %}
    <label for="{{ name }}" class="comp-label">
        {{ label }}{% if required %} <span class="text-error-600">*</span>{% endif %}
    </label>
    {% endif %}
    <div class="relative rounded-md shadow-sm">
        {% if icon %}
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
            {% include "components_ui/elementos/icon.html" with name=icon size="w-5 h-5" classes="text-gray-400" %}
        </div>
        {% endif %}
        <input 
            type="{{ type }}" 
            name="{{ name }}" 
            id="{{ name }}" 
            class="comp-input {% if icon %}pl-10{% endif %} 
                   {% if validation %}comp-input-error{% endif %}
                   {% if disabled or readonly %}bg-gray-100 text-gray-500{% endif %}"
            placeholder="{{ placeholder }}"
            value="{{ value }}"
            {% if required %}required{% endif %}
            {% if disabled %}disabled{% endif %}
            {% if readonly %}readonly{% endif %}
            {% if mask %}data-mask="{{ mask }}"{% endif %}
        >
        {% if validation %}
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
            <svg class="h-5 w-5 text-error-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
            </svg>
        </div>
        {% endif %}
    </div>
    {% if validation %}
    <p class="mt-2 text-sm text-error-600" id="{{ name }}-error">{{ validation }}</p>
    {% endif %}
</div>
