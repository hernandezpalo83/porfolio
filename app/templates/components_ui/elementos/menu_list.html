<div class="{{ classes }}">
    {% if title %}
    <h3 class="px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">
        {{ title }}
    </h3>
    {% endif %}
    <ul class="space-y-1">
        {% for item in items %}
        <li>
            <a href="{{ item.url|default:'#' }}" class="flex items-center px-3 py-2 text-sm font-medium rounded-md
                {% if item.active %}text-primary-700 bg-primary-50{% else %}text-gray-700 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                {% if item.icon %}
                    {% include "components_ui/elementos/icon.html" with name=item.icon size="w-5 h-5 flex-shrink-0 mr-3" classes="text-gray-400" %}
                {% endif %}
                <span class="truncate">{{ item.text }}</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
