<button 
    type="{{ type }}"
    {% if form %}form="{{ form }}"{% endif %}
    {% if id %}id="{{ id }}"{% endif %}
    {% if disabled %}disabled{% endif %}
    {% if onclick %}onclick="{{ onclick }}"{% endif %}
    {% if tooltip %}title="{{ tooltip }}"{% endif %}
    class="{% if not classes %}w-full md:w-auto{% endif %} 
           inline-flex items-center justify-center font-medium rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2
           disabled:opacity-50 disabled:cursor-not-allowed
           {% if size == 'small' %}px-3 py-1.5 text-sm{% elif size == 'large' %}px-6 py-3 text-lg{% else %}px-4 py-2 text-sm{% endif %}
           comp-btn-{{ appearance }}-{{ color }} 
           {{ classes }}"
    {% if style %}style="{{ style }}"{% endif %}
>
    {% if loading %}
    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    {% elif icon %}
        {% include "components_ui/elementos/icon.html" with name=icon size="w-5 h-5" classes="mr-2 -ml-1" %}
    {% endif %}
    
    {{ text }}

    {% if icon_right and not loading %}
        {% include "components_ui/elementos/icon.html" with name=icon_right size="w-5 h-5" classes="ml-2 -mr-1" %}
    {% endif %}
</button>
