{% load components_ui %}
<nav class="flex px-4 py-2 border border-gray-100 bg-white/50 backdrop-blur-md rounded-xl shadow-sm italic text-xs font-bold {{ classes }}" aria-label="Breadcrumb">
    <ol class="flex items-center space-x-2">
        <li>
            <div class="flex items-center">
                <a href="/" class="text-gray-400 hover:text-primary-600 transition-colors">
                    <svg class="h-4 w-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011-1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                    </svg>
                </a>
            </div>
        </li>
        {% for item in items %}
        <li>
            <div class="flex items-center">
                <svg class="h-5 w-5 flex-shrink-0 text-gray-300" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                </svg>
                <a href="{{ item.url|default:'#' }}" class="ml-2 hover:text-primary-600 transition-colors 
                   {% if forloop.last %} text-gray-900 font-black uppercase tracking-widest {% else %} text-gray-500 {% endif %}">
                    {{ item.title }}
                </a>
            </div>
        </li>
        {% endfor %}
    </ol>
</nav>
