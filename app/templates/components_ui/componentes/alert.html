{% load components_ui %}
<div class="relative w-full rounded-2xl p-5 border border-blue-200 bg-blue-50 text-blue-900 {{ classes }} flex items-start gap-4 shadow-sm group">
    <div class="flex-shrink-0 text-blue-500">
        {% comp_icon name="CheckCircleIcon" size="w-6 h-6" %}
    </div>
    <div class="flex-1">
        <p class="text-sm font-bold leading-6">{{ text|default:title|default:"Mensaje de alerta informativa" }}</p>
    </div>
    {% if dismissible %}
    <button type="button" class="flex-shrink-0 text-blue-400 hover:text-blue-600 p-1 rounded-full hover:bg-blue-100 transition-all opacity-0 group-hover:opacity-100" onclick="this.closest('.relative').remove()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
    {% endif %}
</div>
