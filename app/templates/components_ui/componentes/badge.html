<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold shadow-sm
    {% if type == 'solid' %}
        bg-blue-600 text-white
    {% elif type == 'outlined' %}
        bg-transparent border border-blue-500 text-blue-600
    {% else %}
        bg-blue-100 text-blue-800
    {% endif %} 
    {{ classes }}">
    {{ text|default:title|default:label|default:"Badge" }}
</span>
