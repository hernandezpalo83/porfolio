<div class="flex items-center gap-3 {{ classes }}">
    <div class="relative inline-flex items-center justify-center 
        {% if size == 'xs' %} w-6 h-6 text-[10px] 
        {% elif size == 'sm' %} w-8 h-8 text-xs 
        {% elif size == 'lg' %} w-12 h-12 text-lg 
        {% elif size == 'xl' %} w-16 h-16 text-2xl 
        {% else %} w-10 h-10 text-sm {% endif %} 
        rounded-full bg-{{ color|default:'primary' }}-600 text-white font-black shadow-lg shadow-{{ color|default:'primary' }}-500/20 overflow-hidden group">
        
        {% if user.profile_image %}
            <img src="{{ user.profile_image.url }}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
        {% else %}
            <span class="uppercase tracking-tighter">{{ user.first_name|first|default:'U' }}{{ user.last_name|first|default:'' }}</span>
        {% endif %}
        
        <div class="absolute inset-0 border-2 border-white/20 rounded-full"></div>
    </div>
    {% if show_name %}
    <div class="flex flex-col">
        <span class="text-sm font-bold text-gray-900">{{ user.get_full_name|default:'Usuario Desconocido' }}</span>
        {% if user.role %}<span class="text-[10px] uppercase font-black text-gray-400 tracking-tighter">{{ user.role }}</span>{% endif %}
    </div>
    {% endif %}
</div>
