{% load components_ui %}
<div class="{{ classes }}">
    <div class="border-b border-gray-200">
        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
            {% for tab in tabs_data %}
            <button 
                id="tab-btn-{{ id }}-{{ forloop.counter0 }}"
                class="tab-btn-{{ id }} {% if active_tab == forloop.counter0 %}border-primary-500 text-primary-600{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} whitespace-nowrap border-b-2 py-4 px-1 text-sm font-medium" 
                onclick="
                    document.querySelectorAll('.tab-content-{{ id }}').forEach(el=>el.classList.add('hidden')); 
                    document.getElementById('tab-{{ id }}-{{ forloop.counter0 }}').classList.remove('hidden');
                    document.querySelectorAll('.tab-btn-{{ id }}').forEach(el=>{
                        el.classList.remove('border-primary-500', 'text-primary-600');
                        el.classList.add('border-transparent', 'text-gray-500');
                    });
                    this.classList.add('border-primary-500', 'text-primary-600');
                    this.classList.remove('border-transparent', 'text-gray-500');
                ">
                {{ tab.title|default:"Tab" }}
            </button>
            {% endfor %}
        </nav>
    </div>
    
    <div class="mt-4">
        {% for tab in tabs_data %}
        <div id="tab-{{ id }}-{{ forloop.counter0 }}" class="tab-content-{{ id }} {% if active_tab != forloop.counter0 %}hidden{% endif %}">
            <div class="p-6 bg-white border border-gray-100 rounded-2xl shadow-sm min-h-[100px]">
                {{ tab.content|safe|default:"Contenido de la pestaña..." }}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
