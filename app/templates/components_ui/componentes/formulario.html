<form method="{{ method }}" action="{{ action }}" id="{{ id }}" class="space-y-6 {{ classes }}">
    {% if csrf_token %}
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    {% endif %}
    
    <!-- Slot content starts here (El contenido irá debajo en el template real) -->
    <!-- Para tags que no permiten html de retorno se usa como wrapper (ej usando inicio/fin) o solo generamos las partes predecibles. -->
    
    <!-- Botonera -->
    <div class="pt-5 mt-5 border-t border-gray-200 flex justify-end gap-3">
        <button type="button" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
            Cancelar
        </button>
        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
            Guardar
        </button>
    </div>
</form>
