{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="data:,">
    <title>HernandezPalo | Interno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Required by components_ui) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8',
                            500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e',
                        },
                    }
                }
            }
        }
        
        // Suprimir el aviso de Tailwind CDN en consola
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            originalWarn.apply(console, args);
        };
    </script>
    <style>
        /* Ajustes para redondeado perfecto en Tabulator */
        .tabulator { border-radius: inherit !important; border: none !important; }
        .tabulator-header { border-top-left-radius: inherit !important; border-top-right-radius: inherit !important; }
    </style>

    <!-- Tabulator Dependencies -->
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_modern.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <link rel="stylesheet" href="{% static 'landing/css/private_portal.css' %}">
</head>

<body>

    <div id="wrapper">

        {% include 'private/components/sidebar.html' %}

        <div id="page-content-wrapper">

            {% include 'private/components/navbar.html' %}

            <main class="container-fluid p-4">
                {% block content %}
                {% endblock %}
            </main>

            {% include 'private/components/footer.html' %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'components_ui/js/components.js' %}"></script>

    <script src="{% static 'landing/js/private_portal.js' %}"></script>
</body>

</html>
