{% load static %}
<style>
    /* --- FONTS: self-hosted woff2 only. Legacy family names used across the
       CSS (poppins-bold, lora-regular…) are aliases of the same files, so each
       file downloads once. --- */
    @font-face { font-family: 'Poppins'; src: url('{% static "landing/fonts/poppins/poppins-regular-webfont.woff2" %}') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Poppins'; src: url('{% static "landing/fonts/poppins/poppins-medium-webfont.woff2" %}') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Poppins'; src: url('{% static "landing/fonts/poppins/poppins-semibold-webfont.woff2" %}') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Poppins'; src: url('{% static "landing/fonts/poppins/poppins-bold-webfont.woff2" %}') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Lora'; src: url('{% static "landing/fonts/lora/lora-regular-webfont.woff2" %}') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Lora'; src: url('{% static "landing/fonts/lora/lora-italic-webfont.woff2" %}') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: 'Lora'; src: url('{% static "landing/fonts/lora/lora-bold-webfont.woff2" %}') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'poppins-regular'; src: url('{% static "landing/fonts/poppins/poppins-regular-webfont.woff2" %}') format('woff2'); font-display: swap; }
    @font-face { font-family: 'poppins-medium'; src: url('{% static "landing/fonts/poppins/poppins-medium-webfont.woff2" %}') format('woff2'); font-display: swap; }
    @font-face { font-family: 'poppins-semibold'; src: url('{% static "landing/fonts/poppins/poppins-semibold-webfont.woff2" %}') format('woff2'); font-display: swap; }
    @font-face { font-family: 'poppins-bold'; src: url('{% static "landing/fonts/poppins/poppins-bold-webfont.woff2" %}') format('woff2'); font-display: swap; }
    @font-face { font-family: 'lora-regular'; src: url('{% static "landing/fonts/lora/lora-regular-webfont.woff2" %}') format('woff2'); font-display: swap; }
    @font-face { font-family: 'lora-italic'; src: url('{% static "landing/fonts/lora/lora-italic-webfont.woff2" %}') format('woff2'); font-display: swap; }
    @font-face { font-family: 'lora-bold'; src: url('{% static "landing/fonts/lora/lora-bold-webfont.woff2" %}') format('woff2'); font-display: swap; }

    /* --- 0. CSS CUSTOM PROPERTIES FOR DARK/LIGHT MODE --- */
    :root {
        /* Light Mode (default) */
        --bg-primary: #FFFFFF;
        --bg-secondary: #F8F8F8;
        --bg-tertiary: #F0F0F0;
        --text-primary: #1A1A1A;
        --text-secondary: #4A4A4A;
        --text-tertiary: #6B6B6B;
        --accent-primary: #CC0052;
        --accent-light: #FF1493;
        --accent-muted: rgba(204, 0, 82, 0.15);
        --border-color: #E0E0E0;
        --card-bg: #FFFFFF;
        --card-shadow: rgba(0, 0, 0, 0.08);
        --section-bg-light: #F8F8F8;
        --section-bg-dark: #FFFFFF;
    }

    /* Dark Mode */
    :root[data-theme="dark"],
    :root[data-theme="dark"] {
        --bg-primary: #0C0C0C;
        --bg-secondary: #1A1A1A;
        --bg-tertiary: #2A2A2A;
        --text-primary: #FFFFFF;
        --text-secondary: #D0D0D0;
        --text-tertiary: #A0A0A0;
        --accent-primary: #FF1493;
        --accent-light: #FF69B4;
        --accent-muted: rgba(255, 20, 147, 0.15);
        --border-color: #3A3A3A;
        --card-bg: #1A1A1A;
        --card-shadow: rgba(0, 0, 0, 0.3);
        --section-bg-light: #1A1A1A;
        --section-bg-dark: #0C0C0C;
    }

    /* --- 0b. THEME SWITCH (navbar) --- */
    .theme-switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 44px;
        padding: 0 .6rem;
        background: none;
        border: 0;
        border-radius: .8rem;
        color: #FFFFFF;
        cursor: pointer;
        font: inherit;
    }

    @media (min-width: 600px) {
        .theme-switch {
            margin: 0 .4rem;
            padding: 0 1.2rem;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0;
        }
    }

    .theme-switch-icon {
        font-size: 1.5rem;
        color: rgba(255, 255, 255, 0.45);
        transition: color 0.25s ease;
    }

    .theme-switch[aria-checked="false"] .theme-switch-sun,
    .theme-switch[aria-checked="true"] .theme-switch-moon {
        color: #FFFFFF;
    }

    .theme-switch-track {
        position: relative;
        width: 36px;
        height: 20px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.2);
        transition: background-color 0.25s ease;
    }

    .theme-switch[aria-checked="true"] .theme-switch-track {
        background: #CC0052;
    }

    .theme-switch-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #FFFFFF;
        transition: transform 0.25s ease;
    }

    .theme-switch[aria-checked="true"] .theme-switch-knob {
        transform: translateX(16px);
    }

    .theme-switch:focus-visible {
        outline: 2px solid #CC0052;
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        .theme-switch-knob, .theme-switch-track, .theme-switch-icon { transition: none; }
    }

    /* --- 0c. DARK THEME OVERRIDES for sections the bundle hardcodes as light --- */
    :root[data-theme="dark"] body,
    :root[data-theme="dark"] #about,
    :root[data-theme="dark"] #resume,
    :root[data-theme="dark"] .grey-section,
    :root[data-theme="dark"] #portfolio,
    :root[data-theme="dark"] #blog-preview {
        background: var(--bg-primary) !important;
        color: var(--text-secondary);
    }

    :root[data-theme="dark"] #about h1, :root[data-theme="dark"] #about h2, :root[data-theme="dark"] #about h3,
    :root[data-theme="dark"] #about h4, :root[data-theme="dark"] #resume h2, :root[data-theme="dark"] #portfolio .section-heading,
    :root[data-theme="dark"] #portfolio h2, :root[data-theme="dark"] #portfolio h3,
    :root[data-theme="dark"] #blog-preview .section-title, :root[data-theme="dark"] #about p.lead {
        color: var(--text-primary);
    }

    :root[data-theme="dark"] #about p, :root[data-theme="dark"] #about li,
    :root[data-theme="dark"] #portfolio p {
        color: var(--text-secondary);
    }

    /* #CC0052 text drops to ~3.4:1 on dark surfaces; use the dark accent (#FF1493) */
    :root[data-theme="dark"] .section-eyebrow,
    :root[data-theme="dark"] .card-meta,
    :root[data-theme="dark"] #blog-preview .section-subtitle,
    :root[data-theme="dark"] .blog-card .read-more,
    :root[data-theme="dark"] dt,
    :root[data-theme="dark"] .stats-tabs li a:hover {
        color: var(--accent-primary) !important;
    }

    /* #companies keeps its white background in both themes */
    :root[data-theme="dark"] #companies .section-eyebrow {
        color: #CC0052 !important;
    }

    #about .info-list a {
        color: var(--accent-primary);
    }

    :root[data-theme="dark"] .blog-card {
        background: var(--card-bg) !important;
        border-color: var(--border-color) !important;
    }

    :root[data-theme="dark"] .empty-msg {
        color: var(--text-secondary) !important;
    }

    :root[data-theme="dark"] .blog-btn {
        color: var(--accent-primary) !important;
        border-color: var(--accent-primary) !important;
    }

    /* --- 1. RESET & BASIC TYPOGRAPHY --- */
    html {
        font-family: sans-serif;
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        font-size: 62.5%;
        box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
        box-sizing: inherit;
    }

    body {
        margin: 0;
        font-weight: normal;
        line-height: 1;
        text-rendering: optimizeLegibility;
        word-wrap: break-word;
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: none;
        -moz-osx-font-smoothing: grayscale;
        -webkit-font-smoothing: antialiased;
    }

    article,
    aside,
    details,
    figcaption,
    figure,
    footer,
    header,
    hgroup,
    main,
    menu,
    nav,
    section,
    summary {
        display: block;
    }

    a {
        background: transparent;
        text-decoration: none;
        line-height: inherit;
    }

    a:active,
    a:hover {
        outline: 0;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        -webkit-font-variant-ligatures: common-ligatures;
        -moz-font-variant-ligatures: common-ligatures;
        font-variant-ligatures: common-ligatures;
        text-rendering: optimizeLegibility;
        margin: 0;
        padding: 0;
    }

    img,
    video {
        max-width: 100%;
        height: auto;
        border: 0;
    }

    div,
    dl,
    dt,
    dd,
    ul,
    ol,
    li,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    pre,
    form,
    p,
    blockquote,
    th,
    td {
        margin: 0;
        padding: 0;
    }

    ul,
    ol {
        list-style: none;
    }

    li {
        display: block;
    }

    /* --- 2. GRID SYSTEM --- */
    .row {
        width: 94%;
        max-width: 1140px;
        margin: 0 auto;
    }

    .row:before,
    .row:after {
        content: "";
        display: table;
    }

    .row:after {
        clear: both;
    }

    .row .row {
        width: auto;
        max-width: none;
        margin-left: -20px;
        margin-right: -20px;
    }

    [class*="col-"] {
        float: left;
    }

    [class*="col-"]+[class*="col-"][class*="col-"] {
        padding: 0 20px;
    }

    .col-twelve {
        width: 100%;
    }

    @media screen and (max-width:1024px) {
        .row .row {
            margin-left: -18px;
            margin-right: -18px;
        }

        [class*="col-"] {
            padding: 0 18px;
        }
    }

    @media screen and (max-width:768px) {
        .row {
            width: auto;
            padding-left: 30px;
            padding-right: 30px;
        }

        .row .row {
            padding-left: 0;
            padding-right: 0;
            margin-left: -15px;
            margin-right: -15px;
        }

        [class*="col-"] {
            padding: 0 15px;
        }
    }

    @media screen and (max-width:600px) {
        .row {
            padding-left: 25px;
            padding-right: 25px;
        }

        .row .row {
            margin-left: -10px;
            margin-right: -10px;
        }

        [class*="col-"] {
            padding: 0 10px;
        }
    }

    /* --- 3. HEADER (mobile-first) --- */
    html,
    body {
        overflow-x: hidden;
        overflow-x: clip;
    }

    html {
        scroll-behavior: smooth;
        scroll-padding-top: 64px;
    }

    @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .skip-link {
        position: absolute;
        left: 1rem;
        top: -10rem;
        z-index: 2000;
        padding: 1.2rem 1.6rem;
        background: #CC0052;
        color: #FFFFFF;
        font-size: 1.5rem;
        border-radius: .6rem;
    }

    .skip-link:focus {
        top: 1rem;
    }

    .icon {
        width: 1em;
        height: 1em;
        flex-shrink: 0;
        vertical-align: -0.125em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    body {
        padding-top: 64px;
    }

    .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: #0C0C0C;
    }

    .site-header-bar {
        display: flex;
        align-items: center;
        gap: .8rem;
        height: 64px;
        padding: 0 1.2rem;
    }

    .site-logo {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-right: auto;
        padding: 0 .4rem;
        font-family: 'poppins-bold', sans-serif;
        font-size: 2rem;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #FF1493;
        white-space: nowrap;
    }

    .site-header-actions {
        display: flex;
        align-items: center;
    }

    .header-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        color: #FFFFFF;
        font-size: 2rem;
        border-radius: .8rem;
        transition: color .2s ease;
    }

    .header-icon:hover,
    .header-icon:focus-visible {
        color: #FF1493;
    }

    .header-social {
        display: none;
    }

    .menu-toggle {
        position: relative;
        width: 44px;
        height: 44px;
        padding: 0;
        background: none;
        border: 0;
        cursor: pointer;
    }

    .menu-toggle span,
    .menu-toggle span::before,
    .menu-toggle span::after {
        position: absolute;
        left: 10px;
        width: 24px;
        height: 3px;
        border-radius: 2px;
        background: #FF1493;
        transition: transform .2s ease, top .2s ease, background-color .2s ease;
    }

    .menu-toggle span {
        top: 50%;
        margin-top: -1.5px;
    }

    .menu-toggle span::before,
    .menu-toggle span::after {
        content: "";
        left: 0;
    }

    .menu-toggle span::before { top: -8px; }
    .menu-toggle span::after { top: 8px; }

    .menu-toggle[aria-expanded="true"] span { background: transparent; }
    .menu-toggle[aria-expanded="true"] span::before { top: 0; transform: rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span::after { top: 0; transform: rotate(-45deg); }

    .main-nav {
        display: none;
        background: #0C0C0C;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        max-height: calc(100vh - 64px);
        overflow-y: auto;
    }

    .main-nav.is-open {
        display: block;
    }

    .main-navigation {
        margin: 0;
        padding: .8rem 1.6rem 2.4rem;
        list-style: none;
    }

    .main-navigation li {
        display: block;
    }

    .main-navigation a {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        min-height: 48px;
        padding: 0 .8rem;
        color: #FFFFFF;
        font-family: 'poppins-medium', sans-serif;
        font-size: 1.6rem;
        border-radius: .8rem;
    }

    .main-navigation a:hover,
    .main-navigation a:focus-visible,
    .main-navigation li.current > a {
        color: #FF1493;
    }

    .main-navigation .icon {
        font-size: 1.8rem;
    }

    .nav-social-mobile {
        display: flex !important;
        gap: .4rem;
        margin-top: 1.2rem;
        padding-top: 1.2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-social-mobile a {
        justify-content: center;
        width: 48px;
        padding: 0;
    }

    @media (min-width: 600px) {
        .header-social {
            display: inline-flex;
        }

        .nav-social-mobile {
            display: none !important;
        }
    }

    @media (min-width: 1024px) {
        .site-header-bar {
            height: 80px;
            padding: 0 3.2rem;
        }

        html {
            scroll-padding-top: 80px;
        }

        body {
            padding-top: 80px;
        }

        .site-logo {
            font-size: 2.4rem;
        }

        .main-nav {
            max-height: calc(100vh - 80px);
        }

        .main-navigation {
            max-width: 1200px;
            margin: 0 auto;
        }
    }

    /* Content reveal (replaces AOS). Content stays visible without JS. */
    /* Hidden only once main.js has taken over (html.reveal-ready), so a stale or
       failed script never leaves sections blank. */
    .reveal-ready [data-reveal] {
        transition: opacity .6s ease, transform .6s ease;
    }

    .reveal-ready [data-reveal]:not(.is-revealed) {
        opacity: 0;
        transform: translateY(1.6rem);
    }

    @media (prefers-reduced-motion: reduce) {
        .reveal-ready [data-reveal]:not(.is-revealed) {
            opacity: 1;
            transform: none;
            transition: none;
        }
    }

    /* --- 4. INTRO SECTON STYLES --- */
    #intro {
        background: #151515 url('{% static "landing/img/intro-bg.webp" %}') no-repeat center bottom;
        -webkit-background-size: cover;
        -moz-background-size: cover;
        background-size: cover;
        background-attachment: fixed;
        width: 100%;
        height: 100%;
        min-height: 720px;
        display: table;
        position: relative;
        text-align: center;
    }

    /* VIS-003: Gradiente animado en el hero ─────────────────────────────
       El overlay oscuro original se sustituye por un gradiente que varía
       suavemente de color (accent #CC0052 → oscuro) en loop infinito.
       La opacidad sigue siendo alta para mantener la legibilidad del texto.
       ─────────────────────────────────────────────────────────────────── */
    @keyframes hero-gradient-shift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .intro-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Gradiente: oscuro dominante con toque de accent en las esquinas */
        background: linear-gradient(
            135deg,
            rgba(10, 10, 10, 0.96) 0%,
            rgba(100, 0, 30, 0.80) 35%,
            rgba(10, 10, 10, 0.96) 65%,
            rgba(80, 0, 25, 0.82) 100%
        );
        background-size: 300% 300%;
        animation: hero-gradient-shift 12s ease infinite;
        /* Respeta prefers-reduced-motion */
    }

    @media (prefers-reduced-motion: reduce) {
        .intro-overlay {
            animation: none;
            background: rgba(17, 17, 17, 0.88);
        }
    }

    .intro-content {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
        -webkit-transform: translateY(-2.1rem);
        -ms-transform: translateY(-2.1rem);
        transform: translateY(-2.1rem);
    }

    .intro-content h1 {
        color: #FFFFFF;
        font-family: "poppins-medium", sans-serif;
        font-size: 8.4rem;
        line-height: 1.071;
        max-width: 900px;
        margin-top: 0;
        margin-bottom: .6rem;
        margin-left: auto;
        margin-right: auto;
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .intro-content .intro-eyebrow {
        color: #FF4D94;
        font-family: "poppins-bold", sans-serif;
        font-size: 2.3rem;
        line-height: 1.565;
        margin-bottom: 0;
        text-transform: uppercase;
        letter-spacing: .3rem;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
    }

    .intro-content .intro-position {
        font-family: "lora-regular", serif;
        font-size: 1.7rem;
        line-height: 2.4rem;
        text-transform: uppercase;
        letter-spacing: .2rem;
        color: #FFFFFF;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
    }

    .intro-content .intro-position span {
        display: inline-block;
    }

    .intro-content .intro-position span::after {
        content: "|";
        text-align: center;
        display: inline-block;
        padding: 0 8px 0 14px;
        color: rgba(255, 255, 255, 0.3);
    }

    .intro-content .intro-position span:first-child::before {
        content: "|";
        text-align: center;
        display: inline-block;
        padding: 0 14px 0 8px;
        color: rgba(255, 255, 255, 0.3);
    }

    .intro-content .button {
        color: #FFFFFF !important;
        border-color: rgba(255, 255, 255, 0.3);
        height: 6rem !important;
        line-height: 5.4rem !important;
        padding: 0 3.5rem 0 3rem !important;
        margin-top: .6rem;
        font-size: 1.3rem;
        text-transform: uppercase;
        letter-spacing: .25rem;
        display: inline-block;
        border: 3px solid;
        transition: all 0.3s ease-in-out;
        background: transparent;
    }

    .intro-content .button:hover,
    .intro-content .button:focus {
        border-color: #cc005f;
        color: #000;
    }

    @media only screen and (max-width:1024px) {
        #intro {
            background-attachment: scroll !important;
            background-position: center center;
        }

        .intro-content h1 {
            font-size: 7.6rem;
        }
    }

    @media only screen and (max-width:768px) {
        #intro {
            min-height: 660px;
        }

        .intro-content h1 {
            font-size: 5.2rem;
        }

        .intro-content .intro-eyebrow {
            font-size: 1.8rem;
        }
    }

    @media only screen and (max-width:600px) {
        #intro {
            min-height: 600px;
        }

        .intro-content h1 {
            font-size: 4.6rem;
        }

        .intro-content .intro-eyebrow {
            font-size: 1.5rem;
        }

        .intro-content .intro-position span::before,
        .intro-content .intro-position span::after {
            display: none !important;
        }
    }
</style>
