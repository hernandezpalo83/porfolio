{% load static ui %}
<style>
    .intro-content h1 .intro-role {
        display: block;
        min-height: 1.3em;
        margin-top: .8rem;
        font-size: .45em;
        line-height: 1.3;
        opacity: .9;
    }

    .intro-buttons {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 1.2rem;
        max-width: 32rem;
        margin: 3rem auto 0;
    }

    .intro-buttons .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin: 0;
    }

    .intro-content .intro-buttons .button-primary {
        background-color: #CC0052;
        border-color: #CC0052;
        color: #FFFFFF;
    }

    .intro-content .intro-buttons .button-primary:hover,
    .intro-content .intro-buttons .button-primary:focus-visible {
        background-color: #A30042;
        border-color: #A30042;
    }

    @media (min-width: 600px) {
        .intro-buttons {
            flex-direction: row;
            justify-content: center;
            max-width: none;
        }
    }
</style>
<section id="intro">
    <div class="intro-overlay"></div>
    <div class="intro-content">
        <div class="row">
            <div class="col-twelve">
                <p class="intro-eyebrow">Hello, World.</p>
                <h1>I'm {{ info.name }}
                    <span class="intro-role"><span id="typed-roles">Technical Product Manager</span></span>
                </h1>
                {% if info.resumen %}
                <p class="intro-position"><span>{{ info.resumen }}</span></p>
                {% endif %}

                <div class="intro-buttons">
                    <a class="button stroke" href="#about">Más sobre mí</a>
                    <a href="{% static 'cv/CV_Javier_Hernandez.pdf' %}" class="button button-primary"
                        download="CV_Javier_Hernandez_Martin.pdf">
                        {% icon "download" %} Descargar CV <span class="sr-only">(PDF)</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
