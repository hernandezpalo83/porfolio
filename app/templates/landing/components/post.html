<section id="blog-preview">
    <div class="row">
        <div class="col-twelve text-center">
            <h5 class="section-subtitle">Insights</h5>
            <h2 class="section-title">Últimos Artículos</h2>
        </div>
    </div>

    <div class="blog-grid">
        {% for post in latest_posts %}
        <div class="blog-card">
            <a href="{{ post.get_absolute_url }}" class="blog-card-link">
                <div class="card-content">
                    <span class="card-meta">
                        {{ post.publish|date:"d M Y" }} ·
                        <span class="read-time">{{ post.get_read_time }} min lectura</span>
                    </span>
                    <h4 class="card-title">{{ post.title }}</h4>

                    <div class="read-more">
                        Leer más →
                    </div>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="col-twelve text-center">
            <p class="empty-msg">Próximamente más contenido técnico sobre Product Management.</p>
        </div>
        {% endfor %}
    </div>

    <div class="row text-center blog-view-more-container">
        <a href="{% url 'blog:post_list' %}" class="button stroke blog-btn">Explorar el Blog Completo</a>
    </div>
</section>
