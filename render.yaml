services:
  - type: web
    name: portfolio
    runtime: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn app.app.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        scope: run_and_build
        value: ${SECRET_KEY}
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: portfolio-render.onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio_db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: app.settings
    disk:
      name: portfolio_data
      mountPath: /var/www/data
      sizeGB: 1

databases:
  - name: portfolio_db
    databaseName: portfolio_db
    user: postgres
    plan: starter
