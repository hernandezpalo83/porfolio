services:
  - type: web
    name: portfolio
    runtime: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn app.app.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        scope: run_and_build
        value: ${SECRET_KEY}
      - key: DEBUG
        scope: run_and_build
        value: false
      - key: ALLOWED_HOSTS
        scope: run_and_build
        value: ${RENDER_EXTERNAL_URL}
      - key: DATABASE_URL
        scope: run_and_build
        fromDatabase:
          name: portfolio_db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        scope: run_and_build
        value: app.settings
    disk:
      name: portfolio_data
      mountPath: /var/www/data
      sizeGB: 1

databases:
  - name: portfolio_db
    plan: free
    ipAllowList: []
